<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Smart Expense & Compliance Audit Workbench</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top App Navigation Bar -->
  <header class="app-header">
    <div class="header-left">
      <div class="brand-icon">$</div>
      <div class="brand-info">
        <span class="brand-title" data-i18n="brandTitle">Smart Expense & Compliance Audit Workbench</span>
        <span class="brand-badge" data-i18n="brandBadge">AI Audit Engine</span>
      </div>
    </div>

    <div class="header-right">
      <!-- Language Switcher Pill -->
      <div class="lang-toggle-group">
        <button class="lang-btn" data-lang="zh">中文</button>
        <button class="lang-btn active" data-lang="en">English</button>
      </div>

      <a href="index.html" class="header-action-btn" title="Open Chinese Portal" style="text-decoration:none;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <span>中文版入口</span>
      </a>
    </div>
  </header>

  <!-- Split Screen Workspace -->
  <main class="main-layout">

    <!-- Left Pane: Expense Feed & Original Document Viewer -->
    <section class="left-pane">
      <!-- Employee Quick Switcher Bar -->
      <div class="employee-selector-bar">
        <div class="selector-header">
          <span class="selector-title" data-i18n="claimantSelectLabel">Pending Claim Documents</span>
        </div>
        <div class="employee-tabs" id="employeeTabs">
          <!-- Dynamically populated via app.js -->
        </div>
      </div>

      <!-- Document Article Viewer -->
      <div class="document-scroll" id="documentScroll">
        <article class="document-article" id="expenseDocViewer">
          <!-- Injected dynamically via app.js -->
        </article>
      </div>
    </section>

    <!-- Right Pane: Name Input, Form Extraction & Compliance Audit -->
    <section class="right-pane">
      <div class="form-audit-scroll">

        <!-- Itemized Form Section Card -->
        <div class="form-section-card">
          <div class="form-header-bar">
            <span class="form-section-title" data-i18n="formTitle">Itemized Claim Form</span>
            <div class="form-header-actions">
              <button class="form-tool-btn" id="btnFillSample" title="Fill data from currently selected claim">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polyline>
                </svg>
                <span data-i18n="btnFillCurrent">Fill Current Doc</span>
              </button>
              <button class="form-tool-btn" id="btnClearForm" title="Clear all fields">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
                <span data-i18n="btnClear">Clear</span>
              </button>
            </div>
          </div>

          <div class="fields-grid">
            <!-- Claimant Name -->
            <div class="field-group">
              <div class="field-label-row">
                <label class="field-label" for="inputClaimant" data-i18n="fieldClaimant">Claimant Name</label>
                <div style="display:inline-flex; align-items:center; gap:8px;">
                  <button class="locate-field-btn" id="btnFillByName" style="color:var(--text-900);">
                    <span data-i18n="btnFillByName">Fill by Name</span>
                  </button>
                  <button class="locate-field-btn" data-target="name">
                    <span data-i18n="locateEvidence">Locate Evidence</span>
                  </button>
                </div>
              </div>
              <input 
                type="text" 
                class="field-input" 
                id="inputClaimant" 
                placeholder="Enter employee name (e.g. James Anderson, Sarah Miller) or trigger Smart Paste..." 
                autocomplete="off" 
                spellcheck="false" 
              />
            </div>

            <!-- Employee ID & Department -->
            <div class="field-row-split" style="display:flex; gap:12px;">
              <div class="field-group" style="flex:1;">
                <div class="field-label-row">
                  <label class="field-label" for="inputEmpId" data-i18n="fieldEmpId">Employee ID</label>
                  <button class="locate-field-btn" data-target="empId">
                    <span data-i18n="locateEvidence">Locate Evidence</span>
                  </button>
                </div>
                <input type="text" class="field-input mono" id="inputEmpId" />
              </div>

              <div class="field-group" style="flex:1;">
                <div class="field-label-row">
                  <label class="field-label" for="inputDept" data-i18n="fieldDept">Department</label>
                  <button class="locate-field-btn" data-target="dept">
                    <span data-i18n="locateEvidence">Locate Evidence</span>
                  </button>
                </div>
                <input type="text" class="field-input" id="inputDept" />
              </div>
            </div>

            <!-- Expense Category -->
            <div class="field-group">
              <div class="field-label-row">
                <label class="field-label" for="inputCategory" data-i18n="fieldCategory">Expense Category</label>
                <button class="locate-field-btn" data-target="category">
                  <span data-i18n="locateEvidence">Locate Evidence</span>
                </button>
              </div>
              <input type="text" class="field-input" id="inputCategory" />
            </div>

            <!-- Amount & Date -->
            <div class="field-row-split" style="display:flex; gap:12px;">
              <div class="field-group" style="flex:1;">
                <div class="field-label-row">
                  <label class="field-label" for="inputAmount" data-i18n="fieldAmount">Total Amount</label>
                  <button class="locate-field-btn" data-target="amount">
                    <span data-i18n="locateEvidence">Locate Evidence</span>
                  </button>
                </div>
                <input type="text" class="field-input mono" id="inputAmount" style="font-weight:600;" />
              </div>

              <div class="field-group" style="flex:1;">
                <div class="field-label-row">
                  <label class="field-label" for="inputDate" data-i18n="fieldDate">Expense Date</label>
                  <button class="locate-field-btn" data-target="date">
                    <span data-i18n="locateEvidence">Locate Evidence</span>
                  </button>
                </div>
                <input type="text" class="field-input" id="inputDate" />
              </div>
            </div>

            <!-- Invoice No -->
            <div class="field-group">
              <div class="field-label-row">
                <label class="field-label" for="inputInvoiceNo" data-i18n="fieldInvoice">Invoice / Receipt No.</label>
                <button class="locate-field-btn" data-target="invoiceNo">
                  <span data-i18n="locateEvidence">Locate Evidence</span>
                </button>
              </div>
              <input type="text" class="field-input mono" id="inputInvoiceNo" />
            </div>

            <!-- Purpose & Vendor Breakdown -->
            <div class="field-group">
              <div class="field-label-row">
                <label class="field-label" for="inputPurpose" data-i18n="fieldPurpose">Business Purpose & Vendor</label>
                <button class="locate-field-btn" data-target="purpose">
                  <span data-i18n="locateEvidence">Locate Evidence</span>
                </button>
              </div>
              <input type="text" class="field-input" id="inputPurpose" />
            </div>
          </div>

          <!-- Audit Verdict Card (Placed right above Action Buttons) -->
          <div class="audit-verdict-card" id="verdictCard" style="margin-top:14px; margin-bottom:14px;">
            <!-- Populated dynamically via app.js -->
          </div>

          <!-- Bottom Audit Action Buttons -->
          <div class="audit-actions-bar">
            <button class="btn-audit-approve" id="btnApprove">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <span data-i18n="btnApprove">Approve & Settle</span>
            </button>
            <button class="btn-audit-reject" id="btnReject">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
              <span data-i18n="btnReject">Reject with Feedback</span>
            </button>
            <button class="btn-audit-export" id="btnExport" title="Export Audit Log JSON">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <span data-i18n="btnExport">Export Log</span>
            </button>
          </div>
        </div>

      </div>
    </section>

  </main>

  <!-- Toast Notification Portal -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="app.js"></script>
</body>
</html>

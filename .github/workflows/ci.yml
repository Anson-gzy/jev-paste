name: macOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Swift Toolchain
        run: swift --version

      - name: Run Core Tests
        run: make test

      - name: Build SmartPaste.app Bundle
        run: make build
